<!DOCTYPE html>
<html lang="id" data-global-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNARISE Generator Social & Chat Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --blue-bright: #007bff;
            --bg: #f4f6f9;
            --panel: #ffffff;
            --text-main: #1a1a1a;
            --border: #eeeeee;
            --input-bg: #ffffff;
        }

        [data-global-theme="dark"] {
            --bg: #0f172a;
            --panel: #1e293b;
            --text-main: #f8fafc;
            --border: #334155;
            --input-bg: #0f172a;
        }

        * { box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            padding: 40px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            transition: background 0.3s, color 0.3s;
        }

        .brand-container { text-align: center; margin-bottom: 30px; }
        h1.brand { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 2.2rem; letter-spacing: -1px; margin: 0; color: var(--blue-bright); text-transform: uppercase; }
        .highlight-oval { display: inline-block; padding: 6px 18px; border-radius: 50px; background: rgba(0, 123, 255, 0.1); color: var(--blue-bright); font-weight: 600; font-size: 0.9rem; margin-top: 8px; border: 1px solid rgba(0, 123, 255, 0.2); }

        .container { width: 100%; max-width: 1100px; display: grid; grid-template-columns: 1fr 380px; gap: 30px; align-items: flex-start; }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

        .setup-panel { background: var(--panel); padding: 24px; border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.02); display: flex; flex-direction: column; gap: 16px; }

        .row-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .control-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 11px; font-weight: 800; text-transform: uppercase; color: #888; letter-spacing: 0.5px; }

        input[type="text"], textarea, select { background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border); padding: 10px 12px; border-radius: 10px; outline: none; font-size: 13px; font-family: inherit; width: 100%; }
        textarea { height: 220px; resize: vertical; line-height: 1.5; font-family: monospace; }

        .member-item { display: flex; flex-direction: column; gap: 8px; background: var(--input-bg); padding: 12px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 10px; }
        .member-row-top { display: flex; align-items: center; gap: 8px; }
        .member-row-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .member-item input[type="text"] { padding: 6px 10px; font-size: 12px; }

        .btn-primary { background: var(--blue-bright); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: opacity 0.2s; font-size: 12px; }
        .btn-secondary { background: transparent; border: 1px solid var(--blue-bright); color: var(--blue-bright); padding: 8px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 11px; }
        .btn-danger { background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 8px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 11px; }
        .btn-primary:hover, .btn-secondary:hover, .btn-danger:hover { opacity: 0.9; }

        .preview-wrapper { position: sticky; top: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        #captureArea { 
            width: 360px; 
            min-height: 580px; 
            background: #fff; 
            display: flex; 
            flex-direction: column; 
            border: 1px solid #ddd; 
            border-radius: 0px !important;
            overflow: hidden; 
            position: relative; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }

        .status-bar { height: 30px; padding: 5px 18px 0; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; letter-spacing: -0.2px; z-index: 10; }
        .status-icons { display: flex; align-items: center; gap: 6px; }
        .battery-container { width: 22px; height: 11px; border: 1px solid currentColor; border-radius: 3px; position: relative; display: flex; align-items: center; padding: 1px; }
        .battery-bar { height: 100%; background: currentColor; border-radius: 1px; }
        .battery-container::after { content: ''; width: 1.5px; height: 4px; background: currentColor; position: absolute; right: -3px; top: 3px; border-radius: 0 1px 1px 0; }

        .chat-header { height: 60px; padding: 0 15px; display: flex; align-items: center; justify-content: space-between; z-index: 10; position: relative; }
        .avatar { width: 38px; height: 38px; background: #ccc; border-radius: 50%; margin-right: 12px; object-fit: cover; display: block; }
        .header-info { display: flex; flex-direction: column; }
        .header-info b { font-size: 14px; display: block; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .header-info span { font-size: 11px; opacity: 0.75; }
        .icon-svg { width: 20px; height: 20px; fill: currentColor; opacity: 0.8; }

        .hide-element { display: none !important; }

        .st-wa-light { background: #075e54; color: #fff; } .hd-wa-light { background: #075e54; color: #fff; } .cv-wa-light { background: #e5ddd5; }
        .st-wa-dark { background: #1f2c34; color: #e9edef; } .hd-wa-dark { background: #1f2c34; color: #e9edef; border-bottom: 1px solid #2a3942; } .cv-wa-dark { background: #0b141a; }
        .st-ig-light { background: #fff; color: #000; } .hd-ig-light { background: #fff; color: #000; border-bottom: 1px solid #efefef; } .cv-ig-light { background: #fff; }
        .st-ig-dark { background: #000; color: #fff; } .hd-ig-dark { background: #000; color: #fff; border-bottom: 1px solid #262626; } .cv-ig-dark { background: #000; }
        .st-im-light { background: #f4f4f4; color: #000; } .hd-im-light { background: #f4f4f4; color: #000; border-bottom: 1px solid #e5e5e5; } .cv-im-light { background: #fff; }
        .st-im-dark { background: #161617; color: #fff; } .hd-im-dark { background: #161617; color: #fff; border-bottom: 1px solid #323236; } .cv-im-dark { background: #000; }
        .cv-po-light { background: #ffffff; padding-top: 25px !important; } .cv-po-dark { background: #111827; padding-top: 25px !important; }

        #chatView { flex: 1; padding: 12px; display: flex; flex-direction: column; overflow-y: auto; }
        .msg-wrapper { display: flex; flex-direction: column; margin-bottom: 12px; width: 100%; }
        .msg-sender-name { font-size: 10.5px; font-weight: 600; margin: 0 0 3px 8px; opacity: 0.7; }
        
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 18px; font-size: 13.5px; line-height: 1.45; position: relative; word-break: break-word; white-space: pre-wrap; }

        .msg.A { align-self: flex-end; }
        .msg.B { align-self: flex-start; }

        .cv-wa-light .msg.A { background: #dcf8c6; color: #303030; border-bottom-right-radius: 2px; }
        .cv-wa-light .msg.B { background: #ffffff; color: #303030; border-bottom-left-radius: 2px; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); }
        .cv-wa-dark .msg.A { background: #005c4b; color: #e9edef; border-bottom-right-radius: 2px; }
        .cv-wa-dark .msg.B { background: #202c33; color: #e9edef; border-bottom-left-radius: 2px; }
        .cv-ig-light .msg.A { background: #3797f0; color: #fff; } .cv-ig-light .msg.B { background: #efefef; color: #000; }
        .cv-ig-dark .msg.A { background: #3797f0; color: #fff; } .cv-ig-dark .msg.B { background: #262626; color: #fff; }
        .cv-im-light .msg.A { background: #007aff; color: #fff; } .cv-im-light .msg.B { background: #e9e9eb; color: #000; }
        .cv-im-dark .msg.A { background: #0a84ff; color: #fff; } .cv-im-dark .msg.B { background: #26262a; color: #fff; }
        .cv-po-light .msg.A { background: var(--blue-bright); color: #fff; border-radius: 10px; } .cv-po-light .msg.B { background: #f3f4f6; color: #000; border-radius: 10px; }
        .cv-po-dark .msg.A { background: var(--blue-bright); color: #fff; border-radius: 10px; } .cv-po-dark .msg.B { background: #374151; color: #fff; border-radius: 10px; }

        .msg-img { max-width: 100%; border-radius: 12px; display: block; margin: 2px 0; }
        .blur-effect { filter: blur(10px) brightness(0.8); }
        .status-meta { font-size: 10px; display: flex; justify-content: flex-end; align-items: center; gap: 3px; margin-top: 4px; opacity: 0.6; }
        .msg.B .status-meta { justify-content: flex-start; }
        .cv-ig-light .status-meta, .cv-ig-dark .status-meta, .cv-im-light .status-meta, .cv-im-dark .status-meta, .cv-po-light .status-meta, .cv-po-dark .status-meta { display: none !important; }
        .app-status-receipt { font-size: 11px; opacity: 0.6; margin: 2px 4px 10px 0; align-self: flex-end; }
        .msg-wrapper:not(:last-child) .app-status-receipt { display: none; }
        .msg-system-action { display: flex; align-items: center; gap: 8px; font-style: italic; opacity: 0.75; font-size: 13px; }

        .reply-quote-box { background: rgba(0,0,0,0.06); border-left: 3.5px solid var(--blue-bright); padding: 5px 8px; border-radius: 6px; font-size: 11.5px; margin-bottom: 6px; }
        .cv-wa-dark .reply-quote-box { background: rgba(255,255,255,0.08); }
        .reply-quote-text { opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

        .file-box { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.05); padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; }
        .cv-wa-dark .file-box { background: rgba(255,255,255,0.1); }

        .vn-layout { display: flex; align-items: center; gap: 10px; width: 180px; padding: 4px 0; }
        .vn-play-btn { font-size: 18px; cursor: pointer; }
        .vn-wave { flex: 1; height: 16px; background: repeating-linear-gradient(90deg, currentColor, currentColor 2px, transparent 2px, transparent 4px); opacity: 0.6; }
        
        .map-layout { width: 200px; background: #e0e0e0; border-radius: 8px; overflow: hidden; margin-top: 4px; border: 1px solid rgba(0,0,0,0.1); }
        .map-visual { height: 80px; background: linear-gradient(45deg, #a3daf2 25%, #bcdca2 25%, #bcdca2 50%, #a3daf2 50%, #a3daf2 75%, #bcdca2 75%); display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .map-desc { padding: 8px; background: #fff; color: #333; font-size: 11px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }

        .date-divider { align-self: center; background: rgba(0,0,0,0.1); color: #444; font-size: 10.5px; font-weight: 700; padding: 4px 12px; border-radius: 8px; margin: 12px 0; text-transform: uppercase; }
        .cv-wa-dark .date-divider, .cv-ig-dark .date-divider, .cv-im-dark .date-divider { background: rgba(255,255,255,0.15); color: #ccc; }

        .msg.N { align-self: center; background: rgba(0,0,0,0.12); color: #222; font-size: 11.5px; text-align: center; font-style: italic; padding: 8px 16px; width: 85%; border-radius: 10px; margin: 12px 0; font-weight: 500; white-space: pre-wrap; }
        .msg.N.sys-box { background: rgba(0,0,0,0.05) !important; border: 1px solid rgba(0,0,0,0.08); border-radius: 6px; font-style: normal; font-size: 11px; opacity: 0.85; color: #444; width: auto; max-width: 90%; }
        .cv-wa-dark .msg.N { background: #182229; color: #8696a0; } .cv-wa-dark .msg.N.sys-box { background: #182229 !important; color: #8696a0; border: none; }
        .cv-ig-dark .msg.N { background: #1c1c1c; color: #a8a8a8; }
        .cv-im-dark .msg.N { background: #1c1c1e; color: #8e8e93; }

        /* Threads Visual Styling */
        .threads-card { background: #ffffff; border-radius: 16px; padding: 16px; margin: 12px 0; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.08); display: flex; gap: 12px; color: #000; width: 100%; box-sizing: border-box; }
        [data-global-theme="dark"] .threads-card { background: #101010; border-color: #262626; color: #f5f5f5; }
        .threads-avatar-col { display: flex; flex-direction: column; align-items: center; }
        .threads-avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: #ccc; }
        .threads-content-col { flex: 1; display: flex; flex-direction: column; }
        .threads-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
        .threads-user-info { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        .threads-display-name { font-size: 13.5px; font-weight: 700; color: currentColor; }
        .threads-verified-badge { width: 13px; height: 13px; fill: #0095f6; display: inline-block; }
        .threads-username { font-size: 11.5px; opacity: 0.55; margin-left: 2px; }
        .threads-time { font-size: 11px; opacity: 0.45; }
        .threads-body { font-size: 13.5px; line-height: 1.55; margin: 6px 0 12px 0; word-break: break-word; white-space: pre-wrap; }
        .threads-actions { display: flex; align-items: center; gap: 18px; margin-top: 6px; opacity: 0.85; }
        .threads-action-item { display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; }
        .threads-icon { width: 16px; height: 16px; fill: currentColor; }

        .switch-container { display: flex; align-items: center; justify-content: space-between; background: var(--input-bg); padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--blue-bright); }
        input:checked + .slider:before { transform: translateX(20px); }

        .crop-modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 9999; 
        }
        .crop-modal-box { 
            background: var(--panel); color: var(--text-main); width: 90%; max-width: 450px; 
            padding: 20px; border-radius: 16px; display: flex; flex-direction: column; gap: 16px; 
        }
        .crop-container-area { width: 100%; height: 300px; background: #000; overflow: hidden; }
        .crop-modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    </style>
</head>
<body>

<div class="brand-container">
    <h1 class="brand">Social & Chat Studio</h1>
    <div class="highlight-oval">Multi-Platform Novel Visualizer</div>
</div>

<div class="container">
    <div class="setup-panel">
        <div class="row-group">
            <div class="control-group">
                <label>Aplikasi Target</label>
                <select id="appSelect" onchange="applyGlobalTheme()">
                    <option value="wa">WhatsApp</option>
                    <option value="ig">Instagram DM</option>
                    <option value="im">iMessage</option>
                    <option value="po">Post Only (Polosan)</option>
                </select>
            </div>
            <div class="control-group">
                <label>Status Bar HP</label>
                <div class="switch-container">
                    <span style="font-size: 12px;">Tampilkan</span>
                    <label class="switch">
                        <input type="checkbox" id="statusBarToggle" checked onchange="applyGlobalTheme()">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <div class="row-group">
            <div class="control-group">
                <label>Baterai (<span id="batVal">85</span>%)</label>
                <input type="range" id="batterySlider" min="1" max="100" value="85" oninput="updateBatteryLevel()">
            </div>
            <div class="control-group">
                <label>Mode Gelap (Dark Theme)</label>
                <div class="switch-container">
                    <span style="font-size: 12px;">Aktifkan</span>
                    <label class="switch">
                        <input type="checkbox" id="darkModeToggle" onchange="applyGlobalTheme()">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <div class="control-group">
            <label>Nama Ruang Chat / Grup Target</label>
            <input type="text" id="chatRoomNameInput" list="savedNamesList" placeholder="Contoh: Renita Arjanti" value="Renita Arjanti" oninput="updateChatLive()" onchange="saveNameToHistory(this.value, 'names')">
        </div>

        <div class="row-group">
            <div class="control-group">
                <label>Status Header</label>
                <select id="statusTypeSelect" onchange="renderStatusField()">
                    <option value="online">Online</option>
                    <option value="typing">Typing...</option>
                    <option value="lastseen">Terakhir Dilihat</option>
                    <option value="none">Sembunyikan Status</option>
                </select>
            </div>
            <div class="control-group">
                <label>Teks Terakhir Dilihat</label>
                <input type="text" id="statusTextInput" value="kemarin 21:15" disabled oninput="updateChatLive()">
            </div>
        </div>

        <div class="control-group">
            <label>Status Pesan (Centang / Receipt)</label>
            <select id="receiptSelect" onchange="updateChatLive()">
                <option value="read">Dibaca / Read (Centang Biru / Seen)</option>
                <option value="delivered">Tersampaikan / Delivered (Centang Dua)</option>
                <option value="sent">Terkirim / Sent (Centang Satu)</option>
            </select>
        </div>

        <div class="control-group">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                <label>Daftar Karakter (A, B, C...)</label>
                <button class="btn-secondary" onclick="addNewMember()">+ Tambah Karakter</button>
            </div>
            <div id="membersContainer"></div>
        </div>

        <div class="control-group">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                <label>Naskah / Script Editor</label>
                <button class="btn-secondary" style="padding:4px 8px; font-size:11px;" onclick="pasteFromClipboard('scriptInput')">📋 Tempel / Paste</button>
            </div>
            <textarea id="scriptInput" oninput="updateChatLive()" placeholder="Contoh sintaks:
[date: 17/08/2026]
A: Halo! Ini baris pertama
Ini baris kedua setelah di-enter [time: 09:00]
B: [reply: Halo!] Iya ada apa? [time: 09:01]
T_A: Ini postingan Threads Laras! 
Paragraf kedua postingan Threads. [t_like: 120] [t_reply: 45] [t_repost: 12]
B: [vn: 12] [time: 09:02]
A: [file: Dokumen_Naskah.docx]
B: [deleted]
[SYS]: Pesan ini terenkripsi"></textarea>
        </div>

        <div class="control-group">
            <label>Sisipkan Gambar Galeri ke Script Editor</label>
            <input type="file" id="chatImageInput" accept="image/*" onchange="injectImageToScript()">
        </div>

        <button class="btn-primary" onclick="downloadHighResPNG()">📸 Export Gambar (High-Res PNG)</button>
    </div>

    <div class="preview-wrapper">
        <div id="captureArea">
            <div class="status-bar" id="statusBar">
                <span id="currentTime">12:00</span>
                <div class="status-icons">
                    <span>📶</span> <span>📶</span>
                    <div class="battery-container">
                        <div class="battery-bar" id="batteryBar" style="width: 85%;"></div>
                    </div>
                </div>
            </div>

            <div class="chat-header" id="chatHeader">
                <div style="display:flex; align-items:center;">
                    <span style="font-size:18px; margin-right:8px; cursor:pointer;">‹</span>
                    <img class="avatar" id="mainAvatar" src="">
                    <div class="header-info">
                        <b id="headerTargetName">Renita Arjanti</b>
                        <span id="headerTargetStatus">Online</span>
                    </div>
                </div>
                <div style="display:flex; gap:12px;">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                </div>
            </div>

            <div id="chatView"></div>
        </div>
    </div>
</div>

<datalist id="savedNamesList"></datalist>
<datalist id="savedUsernamesList"></datalist>

<div class="crop-modal-overlay" id="cropModalOverlay">
    <div class="crop-modal-box">
        <h4 style="margin:0; font-family:'Poppins';">Atur / Crop Avatar Karakter</h4>
        <div class="crop-container-area">
            <img id="cropImageTarget" style="max-width: 100%; display: block;">
        </div>
        <div class="crop-modal-actions">
            <button class="btn-secondary" onclick="closeCropModal()">Batal</button>
            <button class="btn-primary" onclick="applyCroppedAvatar()">Simpan Crop</button>
        </div>
    </div>
</div>

<script>
let loadedChatImages = {};
let membersDB = {
    'A': { name: 'Laras', threadsName: 'Larasati', username: '@larasati_print', verified: true, avatar: '' },
    'B': { name: 'Budi', threadsName: 'Budi Santoso', username: '@budisantoso', verified: false, avatar: '' }
};

let cropperInstance = null;
let currentCropTargetKey = null;

window.onload = function() {
    renderMemberPanelUI();
    applyGlobalTheme();
    updateLiveClock();
    setInterval(updateLiveClock, 1000);
    loadNameHistory();
};

function updateLiveClock() {
    const now = new Date();
    const hours = now.getHours().toString().padStart(2, '0');
    const minutes = now.getMinutes().toString().padStart(2, '0');
    document.getElementById('currentTime').innerText = `${hours}:${minutes}`;
}

function saveNameToHistory(value, type) {
    if (!value || value.trim() === '') return;
    const storageKey = type === 'names' ? 'history_names' : 'history_usernames';
    let history = JSON.parse(localStorage.getItem(storageKey)) || [];
    if (!history.includes(value.trim())) {
        history.push(value.trim());
        localStorage.setItem(storageKey, JSON.stringify(history));
        loadNameHistory();
    }
}

function loadNameHistory() {
    const namesHistory = JSON.parse(localStorage.getItem('history_names')) || [];
    const usernamesHistory = JSON.parse(localStorage.getItem('history_usernames')) || [];
    
    const namesDatalist = document.getElementById('savedNamesList');
    const usernamesDatalist = document.getElementById('savedUsernamesList');
    
    if (namesDatalist) {
        namesDatalist.innerHTML = namesHistory.map(name => `<option value="${name}">`).join('');
    }
    if (usernamesDatalist) {
        usernamesDatalist.innerHTML = usernamesHistory.map(uname => `<option value="${uname}">`).join('');
    }
}

async function pasteFromClipboard(targetInputId) {
    const inputArea = document.getElementById(targetInputId);
    try {
        if (navigator.clipboard && navigator.clipboard.readText) {
            const text = await navigator.clipboard.readText();
            inputArea.value += (inputArea.value ? '\n' : '') + text;
            updateChatLive();
            return;
        }
    } catch (err) {
        console.warn("Clipboard API diblokir.");
    }
    inputArea.focus();
    inputArea.select();
    if (!document.execCommand('paste')) {
        alert("Silakan tempel secara manual.");
    }
}

function renderMemberPanelUI() {
    const container = document.getElementById('membersContainer');
    if (!container) return;
    container.innerHTML = '';
    Object.keys(membersDB).forEach(key => {
        const div = document.createElement('div');
        div.className = 'member-item';
        
        const hasCustomAvatar = !!membersDB[key].avatar;
        
        div.innerHTML = `
            <div class="member-row-top">
                <b style="width:20px; color:var(--blue-bright);">${key}:</b>
                <input type="text" list="savedNamesList" placeholder="Nama Chat" value="${membersDB[key].name}" oninput="updateMemberData('${key}', 'name', this.value)" onchange="saveNameToHistory(this.value, 'names')">
                <input type="file" accept="image/*" style="display:none" id="file-${key}" onchange="openCropModalForMember('${key}', this)">
                <button class="btn-secondary" style="padding:4px 8px; font-size:11px;" onclick="document.getElementById('file-${key}').click()">
                    ${hasCustomAvatar ? 'Ganti Foto' : 'Unggah Foto'}
                </button>
                ${hasCustomAvatar ? `<button class="btn-danger" style="padding:4px 8px; font-size:11px;" onclick="removeMemberAvatar('${key}')">Hapus</button>` : ''}
            </div>
            <div class="member-row-bottom">
                <input type="text" list="savedNamesList" placeholder="Display Name Threads" value="${membersDB[key].threadsName || ''}" oninput="updateMemberData('${key}', 'threadsName', this.value)" onchange="saveNameToHistory(this.value, 'names')">
                <input type="text" list="savedUsernamesList" placeholder="Username Threads (@...)" value="${membersDB[key].username || ''}" oninput="updateMemberData('${key}', 'username', this.value)" onchange="saveNameToHistory(this.value, 'usernames')">
            </div>
            <div style="display:flex; align-items:center; gap:8px; font-size:11px; margin-top:2px;">
                <input type="checkbox" id="verif-${key}" ${membersDB[key].verified ? 'checked' : ''} onchange="updateMemberData('${key}', 'verified', this.checked)">
                <label for="verif-${key}" style="text-transform:none; font-weight:normal; color:currentColor;">Verified Badge (Threads)</label>
            </div>
        `;
        container.appendChild(div);
    });
}

function removeMemberAvatar(key) {
    if(membersDB[key]) {
        membersDB[key].avatar = '';
        renderMemberPanelUI();
        updateChatLive();
    }
}

function addNewMember() {
    const currentCount = Object.keys(membersDB).length;
    const nextKey = String.fromCharCode(65 + currentCount);
    if(currentCount >= 26) return alert("Batas maksimal inisial alfabet tercapai.");
    membersDB[nextKey] = { 
        name: `Karakter ${nextKey}`, 
        threadsName: `Karakter ${nextKey}`, 
        username: `@karakter_${nextKey.toLowerCase()}`, 
        verified: false, 
        avatar: '' 
    };
    renderMemberPanelUI();
    updateChatLive();
}

function updateMemberData(key, field, val) {
    membersDB[key][field] = val;
    updateChatLive();
}

function openCropModalForMember(key, input) {
    if (input.files && input.files[0]) {
        currentCropTargetKey = key;
        const reader = new FileReader();
        reader.onload = function(e) {
            const cropImg = document.getElementById('cropImageTarget');
            cropImg.src = e.target.result;
            
            document.getElementById('cropModalOverlay').style.display = 'flex';
            
            if (cropperInstance) {
                cropperInstance.destroy();
            }
            
            cropperInstance = new Cropper(cropImg, {
                aspectRatio: 1,
                viewMode: 1,
                autoCropArea: 0.9,
            });
            input.value = '';
        };
        reader.readAsDataURL(input.files[0]);
    }
}

function closeCropModal() {
    document.getElementById('cropModalOverlay').style.display = 'none';
    if (cropperInstance) {
        cropperInstance.destroy();
        cropperInstance = null;
    }
}

function applyCroppedAvatar() {
    if (!cropperInstance || !currentCropTargetKey) return;
    const canvas = cropperInstance.getCroppedCanvas({ width: 300, height: 300 });
    const base64Avatar = canvas.toDataURL('image/png');
    membersDB[currentCropTargetKey].avatar = base64Avatar;
    closeCropModal();
    renderMemberPanelUI();
    updateChatLive();
}

function renderStatusField() {
    const type = document.getElementById('statusTypeSelect').value;
    document.getElementById('statusTextInput').disabled = (type !== 'lastseen');
    updateChatLive();
}

function updateBatteryLevel() {
    const v = document.getElementById('batterySlider').value;
    document.getElementById('batVal').innerText = v;
    document.getElementById('batteryBar').style.width = v + '%';
}

function applyGlobalTheme() {
    const isDarkMode = document.getElementById('darkModeToggle').checked;
    const app = document.getElementById('appSelect').value;
    const showBar = document.getElementById('statusBarToggle').checked;
    
    document.documentElement.setAttribute('data-global-theme', isDarkMode ? 'dark' : 'light');

    const sb = document.getElementById('statusBar');
    const ch = document.getElementById('chatHeader');
    const cv = document.getElementById('chatView');

    sb.className = showBar ? 'status-bar' : 'status-bar hide-element';
    ch.className = 'chat-header';

    const subTheme = isDarkMode ? 'dark' : 'light';
    
    if (app === 'wa') {
        sb.classList.add('st-wa-' + subTheme); ch.classList.add('hd-wa-' + subTheme); cv.className = 'cv-wa-' + subTheme;
    } else if (app === 'ig') {
        sb.classList.add('st-ig-' + subTheme); ch.classList.add('hd-ig-' + subTheme); cv.className = 'cv-ig-' + subTheme;
    } else if (app === 'im') {
        sb.classList.add('st-im-' + subTheme); ch.classList.add('hd-im-' + subTheme); cv.className = 'cv-im-' + subTheme;
    } else if (app === 'po') {
        sb.className = 'status-bar hide-element'; ch.className = 'chat-header hide-element'; cv.className = 'cv-po-' + subTheme;
    }
    updateChatLive();
}

function injectImageToScript() {
    const fileInput = document.getElementById('chatImageInput');
    if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const imgId = `[image_${Object.keys(loadedChatImages).length + 1}]`;
            loadedChatImages[imgId] = e.target.result;
            document.getElementById('scriptInput').value += `\nA: [img:${e.target.result}]`;
            updateChatLive();
        };
        reader.readAsDataURL(fileInput.files[0]);
    }
}

function getDefaultAvatarSVG(nameStr) {
    const namaClean = (nameStr || 'User').trim();
    let inisial = "U";
    if(namaClean.length > 0) {
        const kata = namaClean.split(' ');
        inisial = kata.length >= 2 ? (kata[0][0] + kata[1][0]).toUpperCase() : namaClean.substring(0, 2).toUpperCase();
    }
    return `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><circle cx='50' cy='50' r='50' fill='%23007bff'/><text x='50%25' y='55%25' font-family='sans-serif' font-size='32' fill='white' text-anchor='middle' font-weight='bold'>${inisial}</text></svg>`;
}

function parseScriptBlocks(scriptText) {
    const rawLines = scriptText.split(/\r?\n/);
    const blocks = [];
    let currentBlock = null;

    rawLines.forEach((line) => {
        const sanitizedLine = line.replace(/[\u200B-\u200D\uFEFF]/g, '');

        if (sanitizedLine.match(/^\[date:\s*(.*?)\]/i)) {
            if (currentBlock) blocks.push(currentBlock);
            const dateVal = sanitizedLine.match(/^\[date:\s*(.*?)\]/i)[1];
            blocks.push({ tag: 'DATE', textLines: [dateVal] });
            currentBlock = null;
            return;
        }

        const match = sanitizedLine.match(/^(T_[A-Za-z0-9]+|[A-Za-z0-9]+|N|SYS|\[SYS\]):\s*(.*)/i);
        if (match) {
            if (currentBlock) blocks.push(currentBlock);
            let tagName = match[1].toUpperCase().replace('[', '').replace(']', '');
            currentBlock = {
                tag: tagName,
                textLines: [match[2]]
            };
        } else {
            if (currentBlock) {
                currentBlock.textLines.push(sanitizedLine);
            } else if (sanitizedLine.trim()) {
                currentBlock = {
                    tag: 'N',
                    textLines: [sanitizedLine]
                };
            }
        }
    });

    if (currentBlock) blocks.push(currentBlock);
    return blocks;
}

function updateChatLive() {
    const app = document.getElementById('appSelect').value;
    const statusType = document.getElementById('statusTypeSelect').value;
    const statusText = document.getElementById('statusTextInput').value;
    const receipt = document.getElementById('receiptSelect').value;
    const scriptText = document.getElementById('scriptInput').value;
    const roomName = document.getElementById('chatRoomNameInput').value;
    const cv = document.getElementById('chatView');

    document.getElementById('headerTargetName').innerText = roomName || 'Chat Room';

    const mainAvatarElement = document.getElementById('mainAvatar');
    if(membersDB['B'] && membersDB['B'].avatar) {
        mainAvatarElement.src = membersDB['B'].avatar;
    } else {
        mainAvatarElement.src = getDefaultAvatarSVG(roomName);
    }

    let finalStatusStr = '';
    if(statusType === 'online') finalStatusStr = 'Online';
    else if(statusType === 'typing') finalStatusStr = 'Typing...';
    else if(statusType === 'lastseen') finalStatusStr = 'terakhir dilihat ' + statusText;
    document.getElementById('headerTargetStatus').innerText = finalStatusStr;

    cv.innerHTML = '';

    let checkIconHtml = '';
    if(receipt === 'sent') checkIconHtml = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>`;
    else if(receipt === 'delivered') checkIconHtml = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 6L8.5 14.5L5 11M22 6l-8.5 8.5"/></svg>`;
    else if(receipt === 'read') {
        let colorCode = app === 'wa' ? '#53bdeb' : '#3797f0';
        checkIconHtml = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="${colorCode}" stroke-width="2.5"><path d="M17 6L8.5 14.5L5 11M22 6l-8.5 8.5"/></svg>`;
    }

    let receiptText = receipt === 'read' ? 'Seen' : (receipt === 'delivered' ? 'Delivered' : 'Sent');

    const blocks = parseScriptBlocks(scriptText);

    blocks.forEach((block) => {
        let rawFullText = block.textLines.join('\n').trim();
        if (!rawFullText && block.tag !== 'DATE') return;

        if (block.tag === 'DATE') {
            const dateDiv = document.createElement('div');
            dateDiv.className = 'date-divider';
            dateDiv.innerText = rawFullText;
            cv.appendChild(dateDiv);
            return;
        }

        // Render Kartu Threads (Diperbaiki agar atribut t_like, t_reply, dll terekstrak presisi)
        if (block.tag.startsWith('T_')) {
            const actorKey = block.tag.substring(2);
            const member = membersDB[actorKey] || { name: 'Unknown', threadsName: 'User Threads', username: '@user', verified: false, avatar: '' };

            let customTime = '1m', likes = '0', replies = '0', reposts = '0', imgUrl = '';

            // Ekstrak tag variabel Threads sebelum merender teks
            rawFullText = rawFullText.replace(/\[t_time:\s*(.*?)\]/gi, (_, g) => { customTime = g.trim(); return ''; });
            rawFullText = rawFullText.replace(/\[t_like:\s*(.*?)\]/gi, (_, g) => { likes = g.trim(); return ''; });
            rawFullText = rawFullText.replace(/\[t_reply:\s*(.*?)\]/gi, (_, g) => { replies = g.trim(); return ''; });
            rawFullText = rawFullText.replace(/\[t_repost:\s*(.*?)\]/gi, (_, g) => { reposts = g.trim(); return ''; });
            rawFullText = rawFullText.replace(/\[t_img:\s*(.*?)\]/gi, (_, g) => { imgUrl = g.trim(); return ''; });

            let avatarSrc = member.avatar || getDefaultAvatarSVG(member.threadsName || member.name);
            const verifiedIcon = member.verified ? `<svg class="threads-verified-badge" viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-1.9 14.7L6 12.6l1.5-1.5 2.6 2.6 6.8-6.8 1.5 1.5-8.3 8.3z"/></svg>` : '';

            const formattedBody = rawFullText.trim().replace(/\n/g, '<br>');

            const tCard = document.createElement('div');
            tCard.className = 'threads-card';
            tCard.innerHTML = `
                <div class="threads-avatar-col">
                    <img class="threads-avatar" src="${avatarSrc}">
                </div>
                <div class="threads-content-col">
                    <div class="threads-header">
                        <div class="threads-user-info">
                            <span class="threads-display-name">${member.threadsName || member.name}</span>
                            ${verifiedIcon}
                            <span class="threads-username">${member.username || '@user'}</span>
                        </div>
                        <span class="threads-time">${customTime}</span>
                    </div>
                    <div class="threads-body">${formattedBody}</div>
                    ${imgUrl ? `<img class="threads-media" style="max-width:100%; border-radius:10px; margin-top:8px;" src="${imgUrl}">` : ''}
                    <div class="threads-actions">
                        <div class="threads-action-item">
                            <svg class="threads-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            <span>${likes}</span>
                        </div>
                        <div class="threads-action-item">
                            <svg class="threads-icon" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                            <span>${replies}</span>
                        </div>
                        <div class="threads-action-item">
                            <svg class="threads-icon" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                            <span>${reposts}</span>
                        </div>
                    </div>
                </div>
            `;
            cv.appendChild(tCard);
            return;
        }

        if (block.tag === 'N' || block.tag === 'SYS') {
            const b = document.createElement('div');
            if(block.tag === 'SYS' || (rawFullText.startsWith('[system:') && rawFullText.endsWith(']'))) {
                b.className = 'msg N sys-box';
                b.innerHTML = rawFullText.replace(/^\[system:\s*/i, '').replace(/\]$/, '').replace(/\n/g, '<br>');
            } else {
                b.className = 'msg N';
                b.innerHTML = rawFullText.replace(/\n/g, '<br>');
            }
            cv.appendChild(b);
            return;
        }

        const actorKey = block.tag;
        let customTime = "12:00";
        let isEdited = false;
        let replyText = null;

        rawFullText = rawFullText.replace(/\[time:\s*(.*?)\]/i, (_, g) => { customTime = g; return ''; });
        rawFullText = rawFullText.replace(/\[edited:\s*(.*?)\]/i, (_, g) => { isEdited = true; return g; });
        rawFullText = rawFullText.replace(/\[reply:\s*(.*?)\]/i, (_, g) => { replyText = g; return ''; });

        if(!membersDB[actorKey]) {
            const b = document.createElement('div');
            b.className = 'msg N'; b.innerHTML = rawFullText.replace(/\n/g, '<br>'); cv.appendChild(b); return;
        }

        const wrapper = document.createElement('div');
        wrapper.className = 'msg-wrapper';

        const bubble = document.createElement('div');
        bubble.className = `msg ${actorKey === 'A' ? 'A' : 'B'}`;

        if(actorKey !== 'A' && Object.keys(membersDB).length > 2) {
            const nameLabel = document.createElement('span');
            nameLabel.className = 'msg-sender-name';
            nameLabel.innerText = membersDB[actorKey].name;
            wrapper.appendChild(nameLabel);
        }

        let innerHTMLContent = '';
        if (replyText) {
            innerHTMLContent += `<div class="reply-quote-box"><div class="reply-quote-text">${replyText}</div></div>`;
        }

        const formattedMessageText = rawFullText.trim().replace(/\n/g, '<br>');

        if(rawFullText.trim() === '[deleted]') {
            innerHTMLContent += `<div class="msg-system-action"><span>🚫</span> <span>${actorKey === 'A' ? 'Anda telah menghapus pesan ini' : 'Pesan ini telah dihapus'}</span></div>`;
        } 
        else if(rawFullText.trim() === '[call_missed]') {
            innerHTMLContent += `<div class="msg-system-action" style="color:#ef4444;"><span>📞</span> <span>Panggilan tidak terjawab</span></div>`;
        } 
        else if(rawFullText.match(/^\[call_voice:\s*(.*?)\]/i)) {
            const dur = rawFullText.match(/^\[call_voice:\s*(.*?)\]/i)[1];
            innerHTMLContent += `<div class="msg-system-action"><span>📞</span> <span>Panggilan Suara (${dur})</span></div>`;
        }
        else if(rawFullText.match(/^\[call_video:\s*(.*?)\]/i)) {
            const dur = rawFullText.match(/^\[call_video:\s*(.*?)\]/i)[1];
            innerHTMLContent += `<div class="msg-system-action"><span>📹</span> <span>Panggilan Video (${dur})</span></div>`;
        }
        else if(rawFullText.match(/^\[vn:\s*(.*?)\]/i)) {
            const duration = rawFullText.match(/^\[vn:\s*(.*?)\]/i)[1];
            innerHTMLContent += `<div class="vn-layout"><span class="vn-play-btn">▶️</span><div class="vn-wave"></div><span style="font-size:11px;opacity:0.7;">0:${duration}</span></div>`;
        }
        else if(rawFullText.match(/^\[file:\s*(.*?)\]/i)) {
            const fileName = rawFullText.match(/^\[file:\s*(.*?)\]/i)[1];
            innerHTMLContent += `<div class="file-box">📄 <span>${fileName}</span></div>`;
        }
        else if(rawFullText.match(/^\[loc:\s*(.*?)\]/i)) {
            const locName = rawFullText.match(/^\[loc:\s*(.*?)\]/i)[1];
            innerHTMLContent += `<div class="map-layout"><div class="map-visual">📍</div><div class="map-desc">${locName}</div></div>`;
        }
        else if(rawFullText.match(/^\[img:\s*(.*?)\]/i) || rawFullText.match(/^\[img_blur:\s*(.*?)\]/i)) {
            const isBlur = rawFullText.includes('img_blur');
            const imgUrl = isBlur ? rawFullText.match(/^\[img_blur:\s*(.*?)\]/i)[1] : rawFullText.match(/^\[img:\s*(.*?)\]/i)[1];
            innerHTMLContent += `<img class="msg-img ${isBlur ? 'blur-effect' : ''}" src="${imgUrl}">`;
        } 
        else {
            innerHTMLContent += `<div>${formattedMessageText}${isEdited ? ' <span style="font-size:10px; opacity:0.6; font-style:italic;">(diedit)</span>' : ''}</div>`;
        }

        bubble.innerHTML = innerHTMLContent;

        if(app === 'wa') {
            const meta = document.createElement('div');
            meta.className = 'status-meta';
            meta.innerHTML = `<span>${customTime}</span>`;
            if(actorKey === 'A') meta.innerHTML += `<span>${checkIconHtml}</span>`;
            bubble.appendChild(meta);
        }

        wrapper.appendChild(bubble);

        if(actorKey === 'A' && (app === 'ig' || app === 'im')) {
            const receiptContainer = document.createElement('span');
            receiptContainer.className = 'app-status-receipt';
            receiptContainer.innerText = receiptText;
            wrapper.appendChild(receiptContainer);
        }

        cv.appendChild(wrapper);
    });

    cv.scrollTop = cv.scrollHeight;
}

function downloadHighResPNG() {
    const area = document.querySelector("#captureArea");
    if (typeof html2canvas === 'undefined') {
        alert("Pustaka html2canvas belum siap dimuat!");
        return;
    }
    html2canvas(area, { scale: 3, backgroundColor: null, useCORS: true, logging: false }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'social-studio-' + Date.now() + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
}
